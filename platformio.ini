; =========================================================================
; PlatformIO Project Configuration
; Project: DESIOT BLE Mesh & MQTT Gateway Irrigation System
; Course : Desain dan Aplikasi IoT - ITS Surabaya
; =========================================================================

[platformio]
default_envs = node1_pump, node2_sensor_lpn, node3_relay_friend, node4_gateway

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -Iinclude

; -------------------------------------------------------------------------
; NODE 1: Pompa Air DC (Generic OnOff Server)
; -------------------------------------------------------------------------
[env:node1_pump]
build_src_filter = +<node1_pump/*>

; -------------------------------------------------------------------------
; NODE 2: Sensor Kelembapan Tanah (Low Power Node)
; -------------------------------------------------------------------------
[env:node2_sensor_lpn]
build_src_filter = +<node2_sensor_lpn/*>

; -------------------------------------------------------------------------
; NODE 3: Relay + Friend Node (Mesh Backbone)
; -------------------------------------------------------------------------
[env:node3_relay_friend]
build_src_filter = +<node3_relay_friend/*>

; -------------------------------------------------------------------------
; NODE 4: Provisioner + Proxy + Gateway Wi-Fi MQTT
; -------------------------------------------------------------------------
[env:node4_gateway]
build_src_filter = +<node4_gateway/*>
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3.0
